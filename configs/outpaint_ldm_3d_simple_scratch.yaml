# Single-stage scratch training: v4 objective plus zero-initialized residual guidance.
data:
  train_root: data/processed/l2-1.485_train/size256_mask64_sourcel2-1.485
  val_root: data/processed/l2-1.485_val/size256_mask64_sourcel2-1.485
  train_cache_dir: data/cache/l2-1.485_train/size256_mask64_sourcel2-1.485
  val_cache_dir: data/cache/l2-1.485_val/size256_mask64_sourcel2-1.485

output:
  dir: Z:/Outpaint_Checkpoint/DPM_OutpaintForCFRTP/outputs/checkpoints/outpaint_3d

model:
  latent_channels: 8
  volume_size: 256
  num_channels: 32
  num_res_blocks: 2
  use_multiscale_context: true
  use_structure_guidance: true
  structure_window: 5
  structure_propagation_latent: 2
  control_gate_scale: 0.9
  attention_resolutions: ""
  dropout: 0.0
  learn_sigma: true
  use_checkpoint: true
  vae_hidden_channels: 64
  vae_num_res_blocks: 2
  vae_num_downsamples: 2

diffusion:
  steps: 1000
  noise_schedule: cosine
  timestep_respacing: ""
  use_kl: false
  rescale_timesteps: false
  rescale_learned_sigmas: false

training:
  scratch_curriculum: false
  lr: 1.0e-4
  backbone_lr: 1.0e-4
  freeze_backbone_steps: 0
  min_lr: 1.0e-4
  lr_warmup_steps: 0
  training_steps: 150001
  training_seed: 20260714
  ema_rate: 0.9999
  batch_size: 1
  log_interval: 10
  save_interval: 2000
  schedule_sampler: uniform
  weight_decay: 0.0
  lr_anneal_steps: 0
  crop_size: 256
  eval_crop_size: 256
  eval_num_samples: 2
  validation_use_ema: false
  loss_known_weight: 1.0
  loss_unknown_weight: 4.0
  loss_boundary_weight: 0.2
  normalize_region_weights: true
  voxel_boundary_width: 12
  voxel_boundary_max_timestep: 250
  voxel_intensity_weight: 0.5
  voxel_normal_gradient_weight: 0.25
  voxel_structure_weight: 0.1
  smooth_voxel_timestep_weight: false
  structure_tensor_window: 5
  augment_flip: true
  allow_spatial_overlap: false
  latent_stats_max_samples: 0
  latent_quantile_low: 0.001
  latent_quantile_high: 0.999
  latent_quantile_max_vectors: 1000000
